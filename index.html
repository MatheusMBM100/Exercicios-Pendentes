<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aulas Pendentes</title>
<meta name="theme-color" content="#1d6fe8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aulas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#effaff; --bg2:#e0f5ee; --card:#ffffffcc; --card-solid:#fff; --ink:#0f2430; --muted:#587480;
  --line:#d1e8ee; --accent:#1d6fe8; --accent2:#12c7a0; --good:#14a37a; --warn:#f0a020; --bad:#e5484d;
  --shadow:0 1px 2px rgba(15,36,48,.05),0 8px 24px -14px rgba(15,36,48,.18); --blob1:#a5defa; --blob2:#a9f0cf;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06141a; --bg2:#0a2024; --card:#0f2229cc; --card-solid:#0f2229; --ink:#e8fbff; --muted:#8fb2ba;
    --line:#1f3d46; --accent:#3d9bff; --accent2:#2ee6b0; --shadow:0 1px 2px #0006,0 8px 24px -14px #000a; --blob1:#0b5a8a; --blob2:#0e6b50;
  }
}
:root[data-theme="dark"]{
  --bg:#06141a; --bg2:#0a2024; --card:#0f2229cc; --card-solid:#0f2229; --ink:#e8fbff; --muted:#8fb2ba;
  --line:#1f3d46; --accent:#3d9bff; --accent2:#2ee6b0; --shadow:0 1px 2px #0006,0 8px 24px -14px #000a; --blob1:#0b5a8a; --blob2:#0e6b50;
}
*{box-sizing:border-box;margin:0}
body{
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01';color:var(--ink);min-height:100vh;
  background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;
  padding:0 16px 80px;position:relative;overflow-x:hidden;
}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(110px);opacity:.3}
body::before{opacity:.28;width:420px;height:420px;background:var(--blob1);top:-120px;left:-100px}
body::after{width:380px;height:380px;background:var(--blob2);bottom:-120px;right:-80px}
.wrap{max-width:920px;margin:0 auto}
header{padding:44px 0 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.1;letter-spacing:-.035em;font-weight:800}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:8px;font-size:.95rem}
.icon-btn{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);color:var(--ink);width:42px;height:42px;border-radius:14px;cursor:pointer;font-size:18px;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.7rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat small{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.panel{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:24px}
.panel h2{font-size:.95rem;margin-bottom:14px;font-weight:700}
.grid{display:grid;grid-template-columns:2fr 1.5fr .8fr .8fr;gap:12px}
label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
input{width:100%;font:inherit;color:var(--ink);background:var(--card-solid);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:.15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.when{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card-solid);color:var(--ink);font:inherit;font-size:.88rem;font-weight:600;padding:9px 15px;border-radius:9px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
#custom{margin-top:12px;max-width:240px;display:none}
.picked{margin-top:10px;font-size:.88rem;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.list{display:grid;gap:12px}
.item{--h:260;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:in .35s ease both}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:hsl(var(--h) 70% 50%)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.count{width:62px;height:62px;border-radius:12px;display:grid;place-items:center;text-align:center;background:hsl(var(--h) 90% 60% / .14);color:hsl(var(--h) 70% 48%);font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:1.5rem;letter-spacing:-.02em;line-height:1}
.count small{display:block;font-size:.6rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .count{color:hsl(var(--h) 90% 75%)}}
:root[data-theme="dark"] .count{color:hsl(var(--h) 90% 75%)}
.info h3{font-size:1.05rem;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.tag{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;background:hsl(var(--h) 90% 60% / .16);color:hsl(var(--h) 70% 42%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:hsl(var(--h) 90% 78%)}}
:root[data-theme="dark"] .tag{color:hsl(var(--h) 90% 78%)}
.date{font-size:.85rem;color:var(--muted)}
.badge{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px}
.b-late{background:#e5484d22;color:var(--bad)} .b-today{background:#f0a02024;color:#c47d00} .b-soon{background:#1d6fe81f;color:var(--accent)} .b-ok{background:#18a87422;color:var(--good)}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.step{display:flex;align-items:center;gap:4px;background:var(--card-solid);border:1.5px solid var(--line);border-radius:14px;padding:3px}
.step button{border:0;background:transparent;color:var(--ink);width:32px;height:32px;border-radius:10px;font-size:18px;cursor:pointer}
.step button:hover{background:var(--line)}
.tools{display:flex;gap:4px}
.tools button{border:0;background:transparent;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:8px}
.tools button:hover{background:var(--line);color:var(--ink)}
.empty{text-align:center;padding:48px 20px;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
.empty .big{font-size:2.6rem;margin-bottom:6px}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{gap:8px}.stat{padding:12px}.stat b{font-size:1.25rem}.stat small{font-size:.62rem;letter-spacing:.04em}
  .item{grid-template-columns:auto 1fr;}
  .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
}
#auth{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--bg),var(--bg2))}
#auth[hidden]{display:none}
#auth .box{width:100%;max-width:380px;background:var(--card-solid);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
#auth h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
#auth p{color:var(--muted);font-size:.9rem;margin-bottom:18px}
#auth label{margin-top:12px}
#auth .btn{width:100%;margin-top:18px}
#auth .alt{display:block;margin:14px auto 0;background:none;border:0;color:var(--accent);font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
#auth-err{color:var(--bad);font-size:.85rem;margin-top:12px}
#auth-ok{color:var(--good);font-size:.85rem;margin-top:12px}
#auth-err:empty,#auth-ok:empty{display:none}
#auth .alt[hidden]{display:none}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn[hidden]{display:none}
.muted{color:var(--muted);font-size:.9rem}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.stat:hover{border-color:var(--bad)}
button.stat.on{border-color:var(--bad);box-shadow:0 0 0 3px #e5484d22}
.stat.alert b{color:var(--bad)}
.goal{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 22px}
.goal .gt{flex:1;min-width:220px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.bar.mini{height:5px;margin-top:10px;max-width:260px}
.mini-t{font-size:.72rem;color:var(--muted);margin-top:4px}
details.panel summary{cursor:pointer;font-weight:700;font-size:.95rem;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+";float:right;color:var(--muted);font-weight:500}
details.panel[open] summary::after{content:"−"}
.prow{margin-top:16px}
.prow .top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;margin-bottom:-2px}
.prow small{color:var(--muted);font-weight:500}
.tabs{display:inline-flex;background:var(--card-solid);border:1.5px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.85rem;padding:7px 14px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters-row input{flex:1;min-width:180px}
.filters-row select{font:inherit;color:var(--ink);background:var(--card-solid);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;outline:none}
.item.late::before{background:var(--bad)}
.item.done{opacity:.85}
.tools .strong{color:var(--accent)}
.post{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:1px dashed var(--line);font-size:.85rem;color:var(--muted)}
.post input{width:auto;padding:8px 10px}
.post .chip{padding:7px 12px;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;background:#0f2430;color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 30px -8px #0008;font-size:.9rem;max-width:calc(100vw - 32px)}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:#7fe3c8;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Aulas <span>pendentes</span></h1>
      <p class="sub">Questões por fazer, matérias, frentes e a data da próxima aula — tudo num lugar só.</p>
    </div>
    <div class="hbtns">
      <button class="icon-btn" id="csv" title="Exportar para planilha (CSV)" hidden>⤓</button>
      <button class="icon-btn" id="bell" title="Lembretes" hidden>🔕</button>
      <button class="icon-btn" id="logout" title="Sair" hidden>⎋</button>
      <button class="icon-btn" id="theme" title="Alternar tema">◐</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><b id="s-aulas">0</b><small>Aulas</small></div>
    <div class="stat"><b id="s-q">0</b><small>Questões pendentes</small></div>
    <button class="stat" id="s-late-card" type="button" title="Mostrar só as atrasadas"><b id="s-late">0</b><small>Atrasadas</small></button>
    <div class="stat"><b id="s-next">—</b><small>Próxima aula</small></div>
  </section>

  <section class="panel goal" id="goal"></section>

  <form class="panel" id="form" autocomplete="off">
    <h2 id="form-title">Nova aula</h2>
    <div class="grid">
      <div><label for="nome">Aula</label><input id="nome" placeholder="Ex.: Termoquímica" required></div>
      <div><label for="materia">Matéria</label><input id="materia" list="materias" placeholder="Ex.: Geografia" required><datalist id="materias"></datalist></div>
      <div><label for="num">Aula (nº + frente)</label><input id="num" placeholder="Ex.: 25B" title="Número da aula seguido da letra da frente, ex.: 25B"></div>
      <div><label for="qtd">Questões</label><input id="qtd" type="number" min="0" value="10" required></div>
    </div>
    <div class="when">
      <label>Próxima aula</label>
      <div class="chips" id="chips">
        <button type="button" class="chip" data-d="1">Daqui 1 dia</button>
        <button type="button" class="chip" data-d="2">2 dias</button>
        <button type="button" class="chip" data-d="3">3 dias</button>
        <button type="button" class="chip" data-d="7">1 semana</button>
        <button type="button" class="chip" data-d="custom">Personalizado</button>
      </div>
      <input id="custom" type="date">
      <div class="picked" id="picked"></div>
    </div>
    <div class="actions">
      <button class="btn primary" type="submit" id="submit">Adicionar aula</button>
      <button class="btn ghost" type="button" id="cancel" hidden>Cancelar</button>
    </div>
  </form>

  <details class="panel" id="prog">
    <summary>Progresso por matéria</summary>
    <div id="prog-list"></div>
  </details>

  <div class="toolbar">
    <h2>Suas aulas</h2>
    <div class="tabs">
      <button type="button" class="on" id="tab-pend">Pendentes</button>
      <button type="button" id="tab-done">Concluídas</button>
    </div>
  </div>
  <div class="filters-row">
    <input id="q" type="search" placeholder="Buscar aula ou matéria…" aria-label="Buscar">
    <select id="sort" aria-label="Ordenar">
      <option value="data">Ordenar: data</option>
      <option value="questoes">Ordenar: mais questões</option>
      <option value="materia">Ordenar: matéria</option>
    </select>
  </div>
  <div class="chips" id="filters" style="margin-bottom:14px"></div>
  <div class="list" id="list"></div>
</div>

<div id="toast" role="status" hidden></div>

<div id="auth" hidden>
  <form class="box" id="auth-form" autocomplete="on">
    <h2 id="auth-title">Entrar</h2>
    <p id="auth-sub">Entre para ver as suas aulas.</p>
    <label for="au">E-mail</label><input id="au" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
    <label for="ap">Senha</label><input id="ap" type="password" autocomplete="current-password" required>
    <div id="auth-err"></div><div id="auth-ok"></div>
    <button class="btn primary" id="auth-go" type="submit">Entrar</button>
    <button class="alt" id="auth-alt" type="button">Criar conta</button>
    <button class="alt" id="auth-forgot" type="button">Esqueci a senha</button>
  </form>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDFvuUnkg9rEaNQaheMMKwEpBN_tly4qLk",
  authDomain: "exercicios-e-aulas-pendentes.firebaseapp.com",
  projectId: "exercicios-e-aulas-pendentes",
  storageBucket: "exercicios-e-aulas-pendentes.firebasestorage.app",
  messagingSenderId: "937837891622",
  appId: "1:937837891622:web:eef4fd4ade1bf452ad56e7"
};
const KEY = 'aulas-pendentes-v1';
const $ = id => document.getElementById(id);
let items = [], goal = 0, log = {}, cloud = null;
let filter = 'Todas', view = 'pend', query = '', sortBy = 'data', onlyLate = false, openPost = null, editId = null, chosen = null;

// ---------- utilidades ----------
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = n => { const d = today(); d.setDate(d.getDate()+n); return d; };
const diffDays = s => Math.round((parse(s) - today()) / 864e5);
const fmt = s => parse(s).toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'});
const hue = str => { let h = 0; for (const c of str.toLowerCase()) h = (h*31 + c.charCodeAt(0)) % 360; return 145 + h % 85; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const parseNum = n => { const s = String(n || ''); return { letra: ((s.match(/[A-Za-z]/) || [''])[0]).toUpperCase(), num: (s.match(/\d+/) || [''])[0] }; };
const aulaTag = n => { const { letra, num } = parseNum(n); return (letra ? ` · Frente ${letra}` : '') + (num ? ` · Aula ${num}` : ''); };
const norm = i => ({ ...i, qtd: +i.qtd || 0, total: Math.max(+i.total || 0, +i.qtd || 0), concluida: !!i.concluida });
const byDate = (a, b) => a.data.localeCompare(b.data) || a.materia.localeCompare(b.materia) || String(a.num||'').localeCompare(String(b.num||''), 'pt', {numeric:true});

const SEED = [{ id: 'seed-geo-25b', nome: 'Geografia', materia: 'Geografia', num: '25B', qtd: 20, total: 20, data: '2026-10-29' },
  { id: 'seed-redacao-enem', nome: 'Redação', materia: 'Redação', num: '', qtd: 1, total: 1, data: '2026-10-29' }];
function legacy() {
  let old = [];
  try { old = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
  old.forEach(i => { if (i.frente !== undefined) { i.materia = i.materia || i.frente.split(' — ')[0]; delete i.frente; } });
  return (old.length ? old : SEED).map(norm);
}

// ---------- salvar, desfazer, aviso ----------
const save = () => { if (cloud) cloud.set({ items, goal, log }).catch(() => toast('Não foi possível salvar. Verifique a conexão.')); };
const snapshot = () => JSON.stringify({ items, log });
function restore(str) { const d = JSON.parse(str); items = d.items; log = d.log; save(); render(); }
function change(msg, fn, extra = []) {
  const before = snapshot(); fn(); save(); render();
  toast(msg, [{ label: 'Desfazer', fn: () => restore(before) }, ...extra]);
}
let toastTimer;
function toast(msg, actions = []) {
  const el = $('toast'); el.innerHTML = `<span>${esc(msg)}</span>`;
  actions.forEach(a => { const b = document.createElement('button'); b.type = 'button'; b.textContent = a.label; b.onclick = () => { el.hidden = true; a.fn(); }; el.appendChild(b); });
  el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 8000);
}

// ---------- meta semanal ----------
function bump(n) {
  const k = iso(today());
  log[k] = Math.max(0, (log[k] || 0) + n);
  const cut = iso(addDays(-120)); Object.keys(log).forEach(d => { if (d < cut || !log[d]) delete log[d]; });
}
function weekDone() {
  const d = today(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const from = iso(d);
  return Object.entries(log).reduce((s, [k, v]) => k >= from ? s + v : s, 0);
}

// ---------- formulário ----------
function setChosen(dateStr, key) {
  chosen = dateStr;
  document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', c.dataset.d === key));
  $('custom').style.display = key === 'custom' ? 'block' : 'none';
  $('picked').textContent = dateStr ? `📅 ${parse(dateStr).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}` : '';
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.d === 'custom') { setChosen($('custom').value || null, 'custom'); $('custom').focus(); }
  else setChosen(iso(addDays(+b.dataset.d)), b.dataset.d);
});
$('custom').addEventListener('input', e => setChosen(e.target.value || null, 'custom'));

function resetForm() {
  editId = null; $('form').reset(); $('qtd').value = 10;
  $('form-title').textContent = 'Nova aula'; $('submit').textContent = 'Adicionar aula'; $('cancel').hidden = true;
  setChosen(null, null);
}
$('cancel').onclick = resetForm;

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (!chosen) { $('picked').textContent = '⚠️ Escolha quando é a próxima aula.'; return; }
  const data = { nome: $('nome').value.trim(), materia: $('materia').value.trim(), num: $('num').value.trim(), qtd: Math.max(0, +$('qtd').value || 0), data: chosen };
  if (editId) items = items.map(i => i.id === editId ? norm({ ...i, ...data, total: Math.max(i.total, data.qtd) }) : i);
  else items.push({ id: crypto.randomUUID?.() || String(Date.now()), ...data, total: data.qtd, concluida: false });
  save(); resetForm(); render();
});

function suggestNext(it) {
  resetForm();
  $('materia').value = it.materia;
  $('num').value = String(it.num || '').replace(/\d+/, d => +d + 1);
  $('form-title').textContent = 'Próxima aula de ' + it.materia;
  $('form').scrollIntoView({ behavior: 'smooth' }); $('nome').focus({ preventScroll: true });
}

// ---------- desenho da tela ----------
function badge(n) {
  if (n < 0) return `<span class="badge b-late">Atrasada · ${-n} ${-n===1?'dia':'dias'}</span>`;
  if (n === 0) return `<span class="badge b-today">Hoje</span>`;
  if (n === 1) return `<span class="badge b-soon">Amanhã</span>`;
  return `<span class="badge ${n<=3?'b-soon':'b-ok'}">Em ${n} dias</span>`;
}

function card(i) {
  const late = !i.concluida && diffDays(i.data) < 0, h = hue(i.materia);
  const pct = i.total ? Math.round((i.total - i.qtd) / i.total * 100) : 0;
  const tag = `<span class="tag">${esc(i.materia)}${aulaTag(i.num)}</span>`;
  if (i.concluida) return `
    <article class="item done" style="--h:${h}">
      <div class="count"><div>✓<small>feita</small></div></div>
      <div class="info"><h3>${esc(i.nome)}</h3>
        <div class="meta">${tag}<span class="date">Concluída${i.concluidaEm ? ' em ' + fmt(i.concluidaEm) : ''}</span></div></div>
      <div class="side"><div class="tools">
        <button data-a="reopen" data-id="${i.id}">Reabrir</button>
        <button data-a="del" data-id="${i.id}">Remover</button></div></div>
    </article>`;
  return `
    <article class="item ${late ? 'late' : ''}" style="--h:${h}">
      <div class="count"><div>${i.qtd}<small>questões</small></div></div>
      <div class="info"><h3>${esc(i.nome)}</h3>
        <div class="meta">${tag}<span class="date">${fmt(i.data)}</span>${badge(diffDays(i.data))}</div>
        ${i.total > i.qtd ? `<div class="bar mini"><i style="width:${pct}%"></i></div><div class="mini-t">${i.total - i.qtd} de ${i.total} feitas</div>` : ''}</div>
      <div class="side">
        <div class="step" title="Questões pendentes">
          <button data-a="dec" data-id="${i.id}" aria-label="Fiz uma questão">−</button>
          <button data-a="inc" data-id="${i.id}" aria-label="Mais uma questão">+</button>
        </div>
        <div class="tools">
          <button data-a="done" data-id="${i.id}" class="strong">Concluir</button>
          <button data-a="post-toggle" data-id="${i.id}">Adiar</button>
          <button data-a="edit" data-id="${i.id}">Editar</button>
          <button data-a="del" data-id="${i.id}">Remover</button>
        </div>
      </div>
      ${openPost === i.id ? `<div class="post"><span>Adiar:</span>
        <button class="chip" data-a="post" data-id="${i.id}" data-d="1">+1 dia</button>
        <button class="chip" data-a="post" data-id="${i.id}" data-d="2">+2 dias</button>
        <button class="chip" data-a="post" data-id="${i.id}" data-d="7">+1 semana</button>
        <input type="date" data-a="postdate" data-id="${i.id}" aria-label="Outra data"></div>` : ''}
    </article>`;
}

function render() {
  const pend = items.filter(i => !i.concluida), feitas = items.filter(i => i.concluida);
  const late = pend.filter(i => diffDays(i.data) < 0);
  $('s-aulas').textContent = pend.length;
  $('s-q').textContent = pend.reduce((s, i) => s + i.qtd, 0);
  $('s-late').textContent = late.length;
  $('s-late-card').classList.toggle('alert', late.length > 0);
  $('s-late-card').classList.toggle('on', onlyLate);
  const next = [...pend].filter(i => diffDays(i.data) >= 0).sort(byDate)[0];
  $('s-next').textContent = next ? (diffDays(next.data) === 0 ? 'Hoje' : diffDays(next.data) === 1 ? 'Amanhã' : fmt(next.data).replace('.', '')) : '—';

  const wk = weekDone();
  $('goal').innerHTML = goal
    ? `<div class="gt"><b>Meta da semana</b> <span class="muted">${wk} de ${goal} questões${wk >= goal ? ' 🎉' : ''}</span><div class="bar"><i style="width:${Math.min(100, wk / goal * 100)}%"></i></div></div><button class="btn ghost" data-goal>Alterar meta</button>`
    : `<div class="gt"><b>Meta da semana</b><div class="muted">Defina quantas questões quer resolver por semana.</div></div><button class="btn ghost" data-goal>Definir meta</button>`;

  const mats = [...new Set(items.map(i => i.materia))].sort();
  $('prog-list').innerHTML = mats.length ? mats.map(m => {
    const its = items.filter(i => i.materia === m), tot = its.reduce((s, i) => s + i.total, 0), fe = its.reduce((s, i) => s + i.total - i.qtd, 0), p = tot ? Math.round(fe / tot * 100) : 0;
    return `<div class="prow"><div class="top"><span>${esc(m)}</span><small>${fe} de ${tot} · ${p}%</small></div><div class="bar" style="--h:${hue(m)}"><i style="width:${p}%;background:hsl(${hue(m)} 70% 50%)"></i></div></div>`;
  }).join('') : '<p class="muted" style="margin-top:12px">Sem dados ainda.</p>';

  if (filter !== 'Todas' && !mats.includes(filter)) filter = 'Todas';
  $('materias').innerHTML = mats.map(f => `<option value="${esc(f)}">`).join('');
  $('filters').innerHTML = ['Todas', ...mats].map(f => `<button class="chip ${f===filter?'on':''}" data-f="${esc(f)}">${esc(f)}</button>`).join('');
  $('tab-pend').textContent = `Pendentes (${pend.length})`; $('tab-done').textContent = `Concluídas (${feitas.length})`;
  $('tab-pend').classList.toggle('on', view === 'pend'); $('tab-done').classList.toggle('on', view === 'done');

  const q = plain(query);
  let shown = (view === 'pend' ? pend : feitas).filter(i =>
    (filter === 'Todas' || i.materia === filter) && (!onlyLate || view !== 'pend' || diffDays(i.data) < 0) &&
    (!q || plain(`${i.nome} ${i.materia} ${i.num}`).includes(q)));
  if (view === 'done') shown.sort((a, b) => (b.concluidaEm || '').localeCompare(a.concluidaEm || ''));
  else if (sortBy === 'questoes') shown.sort((a, b) => b.qtd - a.qtd || byDate(a, b));
  else if (sortBy === 'materia') shown.sort((a, b) => a.materia.localeCompare(b.materia) || byDate(a, b));
  else shown.sort(byDate);

  $('list').innerHTML = shown.length ? shown.map(card).join('')
    : `<div class="empty"><div class="big">${view === 'pend' ? '📚' : '✅'}</div>${
        items.length && (q || filter !== 'Todas' || onlyLate) ? 'Nenhuma aula encontrada com esses filtros.'
        : view === 'pend' ? (items.length ? 'Tudo em dia! Nenhuma aula pendente.' : 'Nenhuma aula ainda. Adicione a primeira acima!') : 'Nenhuma aula concluída ainda.'}</div>`;
}

// ---------- eventos ----------
$('filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; render(); } });
$('tab-pend').onclick = () => { view = 'pend'; render(); };
$('tab-done').onclick = () => { view = 'done'; render(); };
$('q').addEventListener('input', e => { query = e.target.value; render(); });
$('sort').addEventListener('change', e => { sortBy = e.target.value; render(); });
$('s-late-card').onclick = () => { onlyLate = !onlyLate; view = 'pend'; render(); };
$('goal').addEventListener('click', e => {
  if (!e.target.closest('[data-goal]')) return;
  const v = prompt('Quantas questões você quer resolver por semana?', goal || 50);
  if (v === null) return;
  goal = Math.max(0, Math.round(+v) || 0); save(); render();
});

function shift(it, days) { const d = parse(it.data) > today() ? parse(it.data) : today(); d.setDate(d.getDate() + days); return iso(d); }
function postpone(it, date) {
  openPost = null;
  change(`Aula adiada para ${fmt(date)}.`, () => { it.data = date; });
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'INPUT') return;
  const it = items.find(i => i.id === b.dataset.id); if (!it) return;
  const a = b.dataset.a;
  if (a === 'dec' && it.qtd > 0) { it.qtd--; bump(1); }
  else if (a === 'inc') { if (it.qtd < it.total) bump(-1); else it.total++; it.qtd++; }
  else if (a === 'post-toggle') { openPost = openPost === it.id ? null : it.id; render(); return; }
  else if (a === 'post') { postpone(it, shift(it, +b.dataset.d)); return; }
  else if (a === 'done') {
    change('Aula concluída.', () => { bump(it.qtd); it.qtd = 0; it.concluida = true; it.concluidaEm = iso(today()); openPost = null; },
      [{ label: 'Próxima aula →', fn: () => suggestNext(it) }]); return;
  }
  else if (a === 'reopen') { change('Aula reaberta.', () => { it.concluida = false; delete it.concluidaEm; it.qtd = it.total; }); return; }
  else if (a === 'del') { change(`"${it.nome}" removida.`, () => { items = items.filter(i => i !== it); }); return; }
  else if (a === 'edit') {
    editId = it.id; $('nome').value = it.nome; $('materia').value = it.materia; $('num').value = it.num || ''; $('qtd').value = it.qtd;
    setChosen(it.data, 'custom'); $('custom').value = it.data;
    $('form-title').textContent = 'Editar aula'; $('submit').textContent = 'Salvar'; $('cancel').hidden = false;
    $('form').scrollIntoView({ behavior: 'smooth' }); return;
  }
  else return;
  save(); render();
});
$('list').addEventListener('change', e => {
  if (e.target.dataset.a !== 'postdate' || !e.target.value) return;
  const it = items.find(i => i.id === e.target.dataset.id); if (it) postpone(it, e.target.value);
});

// ---------- exportar ----------
$('csv').onclick = () => {
  const rows = [['Matéria', 'Frente', 'Aula', 'Assunto', 'Questões pendentes', 'Total de questões', 'Próxima aula', 'Situação']];
  [...items].sort(byDate).forEach(i => { const { letra, num } = parseNum(i.num);
    rows.push([i.materia, letra, num, i.nome, i.qtd, i.total, i.data, i.concluida ? 'Concluída' : diffDays(i.data) < 0 ? 'Atrasada' : 'Pendente']); });
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'aulas-pendentes.csv'; document.body.appendChild(a); a.click(); a.remove();
};

// ---------- lembretes ----------
const notifOn = () => { try { return 'Notification' in window && Notification.permission === 'granted' && localStorage.getItem(KEY + '-notif') === '1'; } catch { return false; } };
const updateBell = () => { $('bell').textContent = notifOn() ? '🔔' : '🔕'; $('bell').title = notifOn() ? 'Lembretes ativados (clique para desativar)' : 'Ativar lembretes'; };
function checkReminders(force) {
  if (!notifOn() || !cloud) return;
  const hoje = items.filter(i => !i.concluida && diffDays(i.data) === 0).length, atr = items.filter(i => !i.concluida && diffDays(i.data) < 0).length;
  if (!hoje && !atr) return;
  const k = iso(today());
  try { if (!force && localStorage.getItem(KEY + '-notified') === k) return; localStorage.setItem(KEY + '-notified', k); } catch {}
  const body = [hoje && `${hoje} aula${hoje > 1 ? 's' : ''} para hoje`, atr && `${atr} atrasada${atr > 1 ? 's' : ''}`].filter(Boolean).join(' · ');
  try { new Notification('Aulas pendentes', { body }); } catch {}
}
$('bell').onclick = async () => {
  if (!('Notification' in window)) { toast('Este navegador não suporta lembretes.'); return; }
  try {
    if (notifOn()) { localStorage.setItem(KEY + '-notif', '0'); toast('Lembretes desativados.'); }
    else if (await Notification.requestPermission() === 'granted') { localStorage.setItem(KEY + '-notif', '1'); toast('Lembretes ativados. Você será avisado ao abrir o site.'); checkReminders(true); }
    else toast('Permissão de notificação negada no navegador.');
  } catch {}
  updateBell();
};
setInterval(() => checkReminders(false), 30 * 60 * 1000);

// ---------- tema ----------
$('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(KEY + '-theme', dark ? 'light' : 'dark'); } catch {}
};
try { const t = localStorage.getItem(KEY + '-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

render(); updateBell();

// ---------- login e nuvem ----------
const loadScript = src => new Promise((ok, fail) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = fail; document.head.appendChild(t); });
async function initCloud() {
  $('auth').hidden = false;
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  try {
    await loadScript(base + 'firebase-app-compat.js');
    await loadScript(base + 'firebase-auth-compat.js');
    await loadScript(base + 'firebase-firestore-compat.js');
  } catch { $('auth-err').textContent = 'Sem conexão com o servidor.'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.firestore();
  try { localStorage.getItem(KEY); db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch {}
  let creating = false, unsub = null;
  const email = u => u.trim().toLowerCase();
  const erros = {
    'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'E-mail ou senha incorretos.', 'auth/invalid-email': 'E-mail inválido.', 'auth/missing-email': 'Digite o seu e-mail.',
    'auth/user-not-found': 'E-mail ou senha incorretos.', 'auth/email-already-in-use': 'Já existe uma conta com esse e-mail.',
    'auth/weak-password': 'A senha precisa ter ao menos 6 caracteres.', 'auth/operation-not-allowed': 'Criação de contas desativada.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco.', 'auth/network-request-failed': 'Sem conexão.'
  };
  const setMode = c => {
    creating = c;
    $('auth-title').textContent = c ? 'Criar conta' : 'Entrar';
    $('auth-go').textContent = c ? 'Criar conta' : 'Entrar';
    $('auth-alt').textContent = c ? 'Já tenho conta' : 'Criar conta';
    $('auth-sub').textContent = c ? 'Escolha um e-mail e uma senha para guardar as suas aulas.' : 'Entre para ver as suas aulas.';
    $('ap').autocomplete = c ? 'new-password' : 'current-password';
    $('auth-forgot').hidden = c;
    $('auth-err').textContent = $('auth-ok').textContent = '';
  };
  setMode(false);
  $('auth-alt').onclick = () => setMode(!creating);
  $('auth-forgot').onclick = async () => {
    $('auth-err').textContent = $('auth-ok').textContent = '';
    const mail = email($('au').value);
    if (!mail) { $('auth-err').textContent = 'Digite o seu e-mail acima.'; return; }
    try {
      await auth.sendPasswordResetEmail(mail);
      $('auth-ok').textContent = 'Se existir uma conta com esse e-mail, enviamos um link para redefinir a senha. Veja também o spam.';
    } catch (err) { $('auth-err').textContent = erros[err.code] || 'Erro: ' + err.code; }
  };
  $('auth-form').addEventListener('submit', async e => {
    e.preventDefault(); $('auth-err').textContent = $('auth-ok').textContent = '';
    try {
      if (creating) await auth.createUserWithEmailAndPassword(email($('au').value), $('ap').value);
      else await auth.signInWithEmailAndPassword(email($('au').value), $('ap').value);
    } catch (err) { $('auth-err').textContent = erros[err.code] || 'Erro: ' + err.code; }
  });
  $('logout').onclick = () => auth.signOut();
  const logged = on => { $('auth').hidden = on; $('logout').hidden = $('csv').hidden = $('bell').hidden = !on; };
  auth.onAuthStateChanged(user => {
    if (unsub) { unsub(); unsub = null; }
    if (user) {
      const ref = db.collection('users').doc(user.uid);
      logged(true); $('ap').value = '';
      unsub = ref.onSnapshot({ includeMetadataChanges: true }, snap => {
        if (!snap.exists) {
          if (snap.metadata.fromCache) return;
          cloud = ref; items = legacy(); goal = 0; log = {}; save(); render(); return;
        }
        const d = snap.data(); cloud = ref;
        items = (d.items || []).map(norm); goal = d.goal || 0; log = d.log || {};
        render(); checkReminders(false);
      }, () => { logged(false); $('auth-err').textContent = 'Sem permissão para ler os dados.'; });
    } else {
      cloud = null; items = []; goal = 0; log = {}; filter = 'Todas'; view = 'pend'; query = ''; onlyLate = false; $('q').value = '';
      render(); logged(false);
    }
  });
}
if (FIREBASE_CONFIG) initCloud();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
